name: Idea
description: Something you'd like OneDeck to do.
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What would it help with?
  - type: input
    id: version
    attributes:
      label: OneDeck version
